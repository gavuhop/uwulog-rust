# Pre-commit framework configuration for uwulog-rust
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      # --- PRE-COMMIT (Nhẹ & Nhanh: format và kiểm tra cơ bản, không compile) ---
      - id: cargo-fmt
        name: cargo fmt
        description: Auto-format Rust code
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      # --- PRE-PUSH (Đầy đủ: kiểm tra lints và tests trước khi push) ---
      - id: cargo-clippy
        name: cargo clippy
        description: Check Cargo lints and warnings
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-test
        name: cargo test
        description: Run Cargo workspace unit tests
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

