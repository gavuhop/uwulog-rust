[workspace]
resolver = "2"
members = [
    "crates/core_util",
    "crates/core_schema",
    "crates/core_protocol",
    "crates/core_filter",
    "crates/driver_transport",
    "crates/driver_sources",
    "crates/core_workspace",
    "crates/core_engine",
    "crates/cli_agent",
    "crates/core_keymap",
    "crates/ui_tui",
    "crates/ui_gui",
    "crates/icons",
    "crates/benchmarks",
    "crates/cli",
]

[workspace.dependencies]
# CLI & Args Parsing
clap = { version = "4.5", features = ["derive"] }

# Serialization & Data Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Data Structures & Algorithms
regex = "1.10"
rayon = "1.10"
arrow = "53"
memchr = "2"

# Async & Channels
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# Utilities & Error Handling
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"

# File Tailer & Event Watching
notify = "6.1"

# Windows Native Event Log APIs (Windows targets)
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_EventLog",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
windows-registry = "0.5"

# Terminal UI
ratatui = "0.28"
crossterm = "0.28"

# Graphical UI (egui)
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
rfd = "0.14"

# Internal Workspace Crates
uwu-core-util = { path = "crates/core_util" }
uwu-core-schema = { path = "crates/core_schema" }
uwu-core-protocol = { path = "crates/core_protocol" }
uwu-core-filter = { path = "crates/core_filter" }
uwu-driver-transport = { path = "crates/driver_transport" }
uwu-driver-sources = { path = "crates/driver_sources" }
uwu-core-workspace = { path = "crates/core_workspace" }
uwu-core-engine = { path = "crates/core_engine" }
uwu-core-keymap = { path = "crates/core_keymap" }
uwu-cli-agent = { path = "crates/cli_agent" }
uwu-ui-tui = { path = "crates/ui_tui" }
uwu-ui-gui = { path = "crates/ui_gui" }
uwu-icons = { path = "crates/icons", default-features = false }
uwu-cli = { path = "crates/cli" }

# Tối ưu compile siêu tốc khi dev, dependencies mượt mà
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Release Dev: App chạy mượt, compile siêu tốc khi dev (< 1s incremental)
[profile.release-dev]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
strip = "none"

# Production Release: Tối ưu hiệu năng kịch khung cho packaging phân phối
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"


