[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/tui",
    "crates/gui",
]

[workspace.dependencies]
# Serialization & Data Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Data Structures & Algorithms
roaring = "0.10"
dashmap = "5.5"
regex = "1.10"
arc-swap = "1.7"
rayon = "1.10"

# Async & Channels
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# Utilities & Error Handling
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"

# File Tailer & Event Watching
notify = "6.1"

# Windows Native Event Log APIs (Windows targets)
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_EventLog",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Terminal UI
ratatui = "0.28"
crossterm = "0.28"

# Graphical UI (egui)
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
rfd = "0.14"

# Internal Workspace Crates
uwu-core = { path = "crates/core" }
