[workspace]
resolver = "2"
members = [
    "crates/core_util",
    "crates/core_schema",
    "crates/core_protocol",
    "crates/core_filter",
    "crates/driver_transport",
    "crates/driver_sources",
    "crates/core_workspace",
    "crates/core_engine",
    "crates/cli_agent",
    "crates/core_keymap",
    "crates/ui_tui",
    "crates/ui_gui",
    "crates/icons",
    "crates/benchmarks",
    "crates/cli",
]

[workspace.dependencies]
# CLI & Args Parsing
clap = { version = "4.5", features = ["derive"] }

# Serialization & Data Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Data Structures & Algorithms
regex = "1.10"
rayon = "1.10"
arrow = "53"
memchr = "2"

# Async & Channels
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# Utilities & Error Handling
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"

# File Tailer & Event Watching
notify = "6.1"

# Windows Native Event Log APIs (Windows targets)
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_EventLog",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
windows-registry = "0.5"

# Terminal UI
ratatui = "0.28"
crossterm = "0.28"

# Graphical UI (egui)
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
rfd = "0.14"

# Internal Workspace Crates
uwu-core-util = { path = "crates/core_util" }
uwu-core-schema = { path = "crates/core_schema" }
uwu-core-protocol = { path = "crates/core_protocol" }
uwu-core-filter = { path = "crates/core_filter" }
uwu-driver-transport = { path = "crates/driver_transport" }
uwu-driver-sources = { path = "crates/driver_sources" }
uwu-core-workspace = { path = "crates/core_workspace" }
uwu-core-engine = { path = "crates/core_engine" }
uwu-core-keymap = { path = "crates/core_keymap" }
uwu-cli-agent = { path = "crates/cli_agent" }
uwu-ui-tui = { path = "crates/ui_tui" }
uwu-ui-gui = { path = "crates/ui_gui" }
uwu-icons = { path = "crates/icons", default-features = false }
uwu-cli = { path = "crates/cli" }

# ==============================================================================
# Build Profiles Optimization
# ==============================================================================
[profile.dev]
# Chỉ giữ lại thông tin số dòng khi panic/crash, loại bỏ bản đồ debug phức tạp
# giúp giảm mạnh dung lượng file .pdb và tăng tốc độ incremental linking trên Windows
debug = "line-tables-only"

# Tối ưu hóa các dependencies bên ngoài (egui, wgpu, arrow, tokio...):
# - Biên dịch 1 lần với opt-level = 2 giúp chạy mượt mà trong quá trình dev
# - Tắt debuginfo thừa của dependencies để giảm hàng trăm MB dung lượng PDB
[profile.dev.package."*"]
opt-level = 2
debug = false

# ==============================================================================
# Production Release Optimization
# ==============================================================================
[profile.release]
opt-level = 3
# Tối ưu hóa liên kết xuyên crate (Link-Time Optimization), tăng hiệu năng 5–10%
lto = "thin"
# Giảm đơn vị sinh mã xuống 1 để LLVM phân tích và tối ưu hóa toàn cục tối đa
codegen-units = 1
# Loại bỏ các symbols debug thừa, giảm mạnh kích thước file thực thi (.exe)
strip = "symbols"
