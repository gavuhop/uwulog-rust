[package]
name = "uwu-core-keymap"
version = "0.1.0"
edition = "2021"
description = "Zed-style 4-layer hierarchical keybindings manager for uwulog"

[dependencies]
serde.workspace = true
serde_json.workspace = true
egui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

[features]
default = ["egui"]
egui = ["dep:egui"]
crossterm = ["dep:crossterm"]
